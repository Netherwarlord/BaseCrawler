name: Build & Package Python App

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  set-version:
    runs-on: [Linux, x86_64]
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is-release: ${{ steps.get_version.outputs.is_release }}
    steps:
      - name: Get version
        id: get_version
        run: |
          if [[ "${GITEA_REF}" == refs/tags/* ]]; then
            VERSION="${GITEA_REF#refs/tags/}"
            IS_RELEASE=true
          else
            VERSION="0.0.0+${GITEA_SHA:0:7}"
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> $GITEA_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITEA_OUTPUT

  build-linux:
    needs: set-version
    runs-on: [Linux, x86_64]
    outputs:
      artifacts: ${{ steps.artifacts.outputs.files }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.RUNNER_TOKEN }}
      - name: Install Python & tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip ruby ruby-dev build-essential rpm nodejs
          pip3 install pyinstaller
          sudo gem install --no-document fpm

      - name: Build Linux binary
        run: pyinstaller --onefile app.py --name myapp

      - name: Build .deb package
        run: |
          fpm -s dir -t deb -n myapp -v ${{ needs.set-version.outputs.version }} dist/myapp=/usr/local/bin/myapp

      - name: Build .rpm package
        run: |
          fpm -s dir -t rpm -n myapp -v ${{ needs.set-version.outputs.version }} dist/myapp=/usr/local/bin/myapp

      - name: Collect artifacts
        id: artifacts
        run: |
          echo "files=$(ls myapp*.deb myapp*.rpm | tr '\n' ',')" >> $GITEA_OUTPUT

      - uses: actions/upload-artifact@v3
        with:
          name: linux-installers
          path: "*.deb,*.rpm"

  build-windows:
    needs: set-version
    runs-on: [Windows, x86_64]
    outputs:
      artifacts: ${{ steps.artifacts.outputs.files }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.RUNNER_TOKEN }}
      - name: Install Node.js
        run: choco install nodejs -y

      - name: Install Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Build Windows binary
        run: pyinstaller --onefile app.py --name myapp.exe

      - name: Create MSI installer (WiX)
        run: |
          mkdir installer
          # This assumes you have installer.wxs and WiX toolset available on your runner
          # You might need to add steps to install WiX
          candle.exe -dAppExe=dist\myapp.exe -dVersion=${{ needs.set-version.outputs.version }} installer.wxs
          light.exe -ext WixUIExtension -o myapp-${{ needs.set-version.outputs.version }}.msi installer.wixobj

      - name: Collect artifacts
        id: artifacts
        run: |
          echo "files=$(ls myapp*.msi | tr '\n' ',')" >> $GITEA_OUTPUT

      - uses: actions/upload-artifact@v3
        with:
          name: windows-installer
          path: myapp-*.msi

  build-macos:
    needs: set-version
    runs-on: [MacOS, x86_64]
    outputs:
      artifacts: ${{ steps.artifacts.outputs.files }}
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.RUNNER_TOKEN }}
      - name: Install Python
        run: |
          brew install python node
          pip3 install pyinstaller

      - name: Build Mac binary
        run: pyinstaller --onefile app.py --name myapp

      - name: Create .pkg installer
        run: |
          mkdir -p pkgroot/usr/local/bin
          cp dist/myapp pkgroot/usr/local/bin/
          pkgbuild --root pkgroot --identifier com.example.myapp --version ${{ needs.set-version.outputs.version }} myapp-${{ needs.set-version.outputs.version }}.pkg

      - name: Collect artifacts
        id: artifacts
        run: |
          echo "files=$(ls myapp*.pkg | tr '\n' ',')" >> $GITEA_OUTPUT

      - uses: actions/upload-artifact@v3
        with:
          name: macos-installer
          path: myapp-*.pkg

  release:
    needs: [set-version, build-linux, build-windows, build-macos]
    if: needs.set-version.outputs.is-release == 'true'
    runs-on: [Linux, x86_64]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3
        with:
          path: release-artifacts

      - name: Create Gitea Release
        uses: https://gitea.com/actions/release-action@v1
        with:
          gitea_token: ${{ secrets.RUNNER_TOKEN }}
          files: release-artifacts/**/*
          tag_name: ${{ needs.set-version.outputs.version }}
          title: "Release ${{ needs.set-version.outputs.version }}"
          draft: false
          prerelease: false

