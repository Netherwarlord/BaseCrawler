name: Build for Windows, Mac, Linux

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

jobs:
  set-version:
    runs-on: [Linux, x86_64]
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      is-release: ${{ steps.get_version.outputs.is_release }}
    steps:
      - name: Get version
        id: get_version
        run: |
          if [[ "${GITEA_REF}" == refs/tags/* ]]; then
            VERSION="${GITEA_REF#refs/tags/}"
            IS_RELEASE=true
          else
            VERSION="0.0.0+${GITEA_SHA:0:7}"
            IS_RELEASE=false
          fi
          echo "version=$VERSION" >> $GITEA_OUTPUT
          echo "is-release=$IS_RELEASE" >> $GITEA_OUTPUT

  build-linux:
    needs: set-version
    runs-on: [Linux, x86_64, Docker]
    container: ubuntu:22.04
    outputs:
      artifacts: ${{ steps.artifacts.outputs.files }}
    steps:
      - name: Install Python & tools
        run: |
          apt update
          apt install -y python3 python3-pip ruby ruby-dev build-essential rpm nodejs git
          pip3 install pyinstaller
          gem install --no-document fpm
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.RUNNER_TOKEN }}

      - name: Build Linux binary
        run: pyinstaller --onefile app.py --name myapp

      - name: Build .deb package
        run: |
          fpm -s dir -t deb -n myapp -v ${{ needs.set-version.outputs.version }} dist/myapp=/usr/local/bin/myapp

      - name: Build .rpm package
        run: |
          fpm -s dir -t rpm -n myapp -v ${{ needs.set-version.outputs.version }} dist/myapp=/usr/local/bin/myapp

      - name: Collect artifacts
        id: artifacts
        run: |
          echo "files=$(ls myapp*.deb myapp*.rpm | tr '\n' ',')" >> $GITEA_OUTPUT

      - uses: actions/upload-artifact@v3
        with:
          name: linux-installers
          path: "*.deb,*.rpm"